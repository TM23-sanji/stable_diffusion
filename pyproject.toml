[project]
name = "stable_diffusion"
version = "0.1.0"
description = "Replication of famous diffusion model papers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "tqdm",
    "einops",
    "openai>=2.35.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
