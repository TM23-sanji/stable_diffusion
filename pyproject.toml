[project]
name = "stable_diffusion"
version = "0.1.0"
description = "Replication of famous diffusion model papers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "diffusers",
    "transformers",
    "accelerate",
    "peft",
    "datasets",
    "Pillow",
    "wandb",
    "huggingface_hub",
    "safetensors",
    "tqdm",
    "bitsandbytes",
    "xformers",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
